<title>Intervalltimer</title>
<style>
  :root { --bg:#16181d; --fg:#fff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Helvetica Neue",sans-serif;
    transition:background .3s;
    padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
    display:flex; flex-direction:column; user-select:none; -webkit-user-select:none;
    overscroll-behavior:none;
  }
  body.prep { --bg:#9a6100; }
  body.work { --bg:#c4311a; }
  body.rest { --bg:#1a7f4b; }
  body.done { --bg:#1d4ed8; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px; }
  #phase { font-size:clamp(34px,11vw,56px); font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
  #time { font-size:clamp(77px,28vw,133px); font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
  #round { font-size:clamp(24px,7vw,34px); font-weight:600; opacity:.9; }
  #bar { width:100%; max-width:420px; height:10px; border-radius:5px; background:rgba(255,255,255,.25); margin-top:18px; overflow:hidden; }
  #bar i { display:block; height:100%; width:0; background:#fff; }
  #total { font-size:20px; opacity:.75; font-variant-numeric:tabular-nums; margin-top:6px; }
  .buttons { display:flex; flex-direction:column; gap:14px; padding:12px 0 24px; }
  button {
    font:inherit; font-size:28px; font-weight:700; color:#fff; border:0; border-radius:22px;
    min-height:84px; width:100%; background:rgba(255,255,255,.22); touch-action:manipulation;
  }
  button:active { transform:scale(.98); opacity:.85; }
  button.primary { background:#fff; color:#111; min-height:104px; font-size:34px; }
  button[hidden] { display:none; }
</style>
</head>
<body>
<main>
  <div id="phase">Bereit</div>
  <div id="time">00:10</div>
  <div id="round">Runde 1 von 20</div>
  <div id="bar"><i id="fill"></i></div>
  <div id="total">Gesamt 23:20</div>
</main>
<div class="buttons">
  <button class="primary" id="main">Start</button>
  <button id="reset" hidden>Zurücksetzen</button>
</div>

<script>
(function () {
  "use strict";
  var PREP = 10000;                       // Countdown vor dem ersten Intervall
  var ROUNDS = 20, WORK = 60000, REST = 10000;
  var ROUND_MS = WORK + REST, TOTAL = ROUNDS * ROUND_MS; // 1 400 000 ms = 23:20
  var END = PREP + TOTAL;

  var $ = function (id) { return document.getElementById(id); };
  var elPhase = $("phase"), elTime = $("time"), elRound = $("round"),
      elFill = $("fill"), elTotal = $("total"), btnMain = $("main"), btnReset = $("reset");

  // Zustand: nur ein Startzeitpunkt (bzw. bei Pause die verstrichene Zeit) – kein Zähler.
  var state = "idle";      // idle | running | paused | done
  var startAt = 0;         // Date.now()-Zeitpunkt, zu dem "Zeit 0" lag
  var pausedElapsed = 0;   // verstrichene ms beim Anhalten
  var lastPhase = -1;      // 0 = Countdown, 1..30 = Belastung/Pause
  var lastTick = 99;       // zuletzt getickte Countdown-Sekunde
  var timer = null, wakeLock = null;

  // ---------- Ton ----------
  var ctx = null, keep = null;

  // Stille WAV-Schleife: hält die iOS-Audiositzung wach (Töne kommen dann auch
  // bei jedem späteren Phasenwechsel und trotz Stumm-Schalter-Einstellung eher durch).
  function silentWav() {
    var n = 8000, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    function str(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE"); str(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 8000, true); v.setUint32(28, 16000, true); v.setUint16(32, 2, true);
    v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, n * 2, true);
    var bytes = new Uint8Array(buf), bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return "data:audio/wav;base64," + btoa(bin);
  }
  function unlockAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC && !ctx) ctx = new AC();
    if (ctx && ctx.state !== "running") ctx.resume();
    if (!keep) {
      keep = new Audio(silentWav());
      keep.loop = true; keep.setAttribute("playsinline", "");
    }
    var p = keep.play(); if (p && p.catch) p.catch(function () {});
    if (ctx) { // stiller Puffer im Tippen-Ereignis
      var b = ctx.createBuffer(1, 1, 22050), s = ctx.createBufferSource();
      s.buffer = b; s.connect(ctx.destination); s.start(0);
    }
  }
  function stopKeep() { if (keep) keep.pause(); }

  function tone(freq, delay, dur, vol, type) {
    if (!ctx) return;
    if (ctx.state !== "running") ctx.resume();
    var t0 = ctx.currentTime + 0.02 + delay;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function tick()      { tone(700, 0, 0.09, 0.5); }                    // Countdown 3-2-1
  function beepWork()  { tone(1000, 0, 0.22, 0.7); }                   // hoch, kurz
  function beepRest()  { tone(560, 0, 0.22, 0.7); }                    // tiefer, kurz
  function finalTone() {                                                // Fanfare, deutlich anders
    [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.22, 0.5, 0.7, "triangle"); });
    tone(1047, 0.88, 1.2, 0.7, "triangle"); tone(784, 0.88, 1.2, 0.4, "triangle");
  }

  // ---------- Zeitberechnung aus Zielzeitpunkten ----------
  function elapsedNow() {
    if (state === "running") return Date.now() - startAt;
    if (state === "paused") return pausedElapsed;
    return 0;
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmt(ms) { var s = Math.ceil(ms / 1000); return pad(Math.floor(s / 60)) + ":" + pad(s % 60); }

  function render() {
    var e = Math.min(elapsedNow(), END);
    if (state === "done") {
      document.body.className = "done";
      elPhase.textContent = "Geschafft!"; elTime.textContent = "00:00";
      elRound.textContent = "Runde " + ROUNDS + " von " + ROUNDS;
      elFill.style.width = "100%"; elTotal.textContent = "Gesamt 00:00";
      return;
    }
    var label, cls, remaining, round, t = e - PREP;
    if (e < PREP) {                                  // Countdown vor Runde 1
      cls = state === "idle" ? "" : "prep";
      label = state === "idle" ? "Bereit" : "Gleich geht’s los";
      remaining = PREP - e; round = 0;
      elFill.style.width = "0%"; elTotal.textContent = "Gesamt " + fmt(TOTAL);
    } else {
      round = Math.floor(t / ROUND_MS);              // 0..14
      var inRound = t - round * ROUND_MS, working = inRound < WORK;
      cls = working ? "work" : "rest";
      label = working ? "Belastung" : "Pause";
      remaining = (working ? WORK : ROUND_MS) - inRound;  // Zielzeitpunkt - jetzt
      elFill.style.width = (t / TOTAL * 100).toFixed(2) + "%";
      elTotal.textContent = "Gesamt " + fmt(TOTAL - t);
    }
    if (state === "paused") label += " · angehalten";
    document.body.className = cls;
    elPhase.textContent = label;
    elTime.textContent = fmt(remaining);
    elRound.textContent = "Runde " + (round + 1) + " von " + ROUNDS;
  }

  function step() {
    if (state !== "running") return;
    var e = Date.now() - startAt;
    if (e >= END) { finish(); return; }
    var phase = e < PREP ? 0 : 1 + Math.floor((e - PREP) / ROUND_MS) * 2 + (((e - PREP) % ROUND_MS) < WORK ? 0 : 1);
    if (phase !== lastPhase) {            // auch nach Hintergrund: nur ein Ton
      lastPhase = phase;
      lastTick = 99;
      if (phase === 0) tick();
      else ((phase - 1) % 2 === 0) ? beepWork() : beepRest();
    }
    // Ticks: Countdown 3-2-1, in jeder Belastung die letzten 5 Sekunden
    var rem = -1, limit = 0;
    if (e < PREP) { rem = PREP - e; limit = 3; }
    else {
      var inRound = (e - PREP) % ROUND_MS;
      if (inRound < WORK) { rem = WORK - inRound; limit = 5; }
    }
    if (rem >= 0) {
      var sec = Math.ceil(rem / 1000);
      if (sec <= limit && sec < lastTick) { lastTick = sec; tick(); }
    }
    render();
  }

  function startLoop() { stopLoop(); timer = setInterval(step, 100); }
  function stopLoop() { if (timer) { clearInterval(timer); timer = null; } }

  // ---------- Bildschirm wach halten ----------
  function lockScreen() {
    if (!("wakeLock" in navigator) || wakeLock) return;
    navigator.wakeLock.request("screen").then(function (l) {
      wakeLock = l; l.addEventListener("release", function () { wakeLock = null; });
    }).catch(function () {});
  }
  function unlockScreen() { if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; } }

  // ---------- Aktionen ----------
  function start() {
    unlockAudio();
    state = "running"; startAt = Date.now(); lastPhase = -1; lastTick = 99;
    lockScreen(); startLoop(); step(); updateButtons();
  }
  function pause() {
    pausedElapsed = Date.now() - startAt; state = "paused";
    stopLoop(); unlockScreen(); stopKeep(); render(); updateButtons();
  }
  function resume() {
    unlockAudio();
    startAt = Date.now() - pausedElapsed; state = "running";   // Zielzeitpunkte verschieben
    lockScreen(); startLoop(); step(); updateButtons();
  }
  function reset() {
    stopLoop(); unlockScreen(); stopKeep();
    state = "idle"; pausedElapsed = 0; lastPhase = -1; lastTick = 99;
    render(); updateButtons();
  }
  function finish() {
    stopLoop(); unlockScreen(); state = "done";
    finalTone(); render(); updateButtons();
    setTimeout(stopKeep, 3000);
  }

  function updateButtons() {
    btnReset.hidden = (state === "idle");
    btnMain.textContent = { idle: "Start", running: "Anhalten", paused: "Fortsetzen", done: "Neu starten" }[state];
  }
  btnMain.addEventListener("click", function () {
    if (state === "idle") start();
    else if (state === "running") pause();
    else if (state === "paused") resume();
    else { reset(); start(); }
  });
  btnReset.addEventListener("click", reset);

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && state === "running") {
      lockScreen(); if (ctx && ctx.state !== "running") ctx.resume();
      if (keep && keep.paused) { var p = keep.play(); if (p && p.catch) p.catch(function () {}); }
      step();
    }
  });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });

  render(); updateButtons();
})();
</script>
</body>
</html>
